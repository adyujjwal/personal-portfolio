<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050507" />

    <!-- Paint the app background immediately so there's no light flash before the stylesheet loads -->
    <style>
      html,
      body {
        margin: 0;
        background-color: #050507;
      }
    </style>

    <title>Adway Ujjwal</title>
    <meta
      name="description"
      content="Senior Software Engineer building scalable systems, intelligent products, and delightful interfaces."
    />

    <!-- OpenGraph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Adway Ujjwal - Senior Software Engineer" />
    <meta
      property="og:description"
      content="Senior Software Engineer building scalable systems, intelligent products, and delightful interfaces."
    />
    <meta property="og:image" content="/images/og.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Adway Ujjwal - Senior Software Engineer" />
    <meta
      name="twitter:description"
      content="Senior Software Engineer building scalable systems, intelligent products, and delightful interfaces."
    />
    <meta name="twitter:image" content="/images/og.svg" />

    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@400,500,700&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Adway Ujjwal",
        "jobTitle": "Senior Software Engineer",
        "worksFor": { "@type": "Organization", "name": "Walmart Global Tech" },
        "address": { "@type": "PostalAddress", "addressLocality": "Bangalore", "addressCountry": "India" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
